version: 2
updates:
  # Actions are pinned to commit SHAs; Dependabot updates the SHA and the
  # version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # The builder's actions share one release and one SHA: update them in
      # one pull request so the workflow never mixes versions.
      home-assistant-builder:
        patterns:
          - "home-assistant/builder*"
  # The base image on the FROM line of the add-on's Dockerfile.
  - package-ecosystem: docker
    directory: /claude-code
    schedule:
      interval: weekly
