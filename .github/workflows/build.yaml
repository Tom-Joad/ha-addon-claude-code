---
name: Build

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    paths:
      - "claude-code/**"
      - "tools/dev/**"
      - ".github/workflows/build.yaml"
      - ".github/dependabot.yml"
  pull_request:
    paths:
      - "claude-code/**"
      - "tools/dev/**"
      - ".github/workflows/build.yaml"
      - ".github/dependabot.yml"
  release:
    types:
      - published
  workflow_dispatch:

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: ha-addon-claude-code
  # Spelled out rather than derived from github.repository_owner: container
  # registries reject upper case in an image name, and the owner has it.
  REGISTRY_PREFIX: ghcr.io/tom-joad

permissions:
  contents: read

# Actions are pinned to commit SHAs, not tags: a tag can be moved. The
# comment after each names the release; Dependabot updates both together.
jobs:
  ingress-test:
    name: Ingress only
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action lists a pull request's commits through the API.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # gitleaks needs history to scan past commits

      - name: Shellcheck
        run: |
          shellcheck -x -P SCRIPTDIR $(git ls-files 'claude-code/rootfs/etc/s6-overlay/s6-rc.d/*/run' \
            'claude-code/rootfs/etc/s6-overlay/s6-rc.d/*/finish' 'tools/dev/*.sh') \
            claude-code/rootfs/etc/s6-overlay/scripts/enable-check.sh \
            claude-code/rootfs/usr/bin/claude-session claude-code/rootfs/usr/bin/claude-memory-baseline

      # The terminal is a root shell with the Supervisor token: check on every
      # change that only Home Assistant's Ingress proxy can reach it.
      - name: Build the image and test who can reach the terminal
        run: tools/dev/ingress-test.sh

      # gitleaks-action refuses the release event ("not yet supported"); the
      # released commit was scanned on its pull request and on main.
      - name: Scan for secrets
        if: github.event_name != 'release'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  init:
    name: Initialize build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
      push: ${{ steps.version.outputs.push }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Determine version
        id: version
        # Event values go through env, never into the script itself: a
        # crafted tag name could otherwise run commands.
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          config_version=$(yq -r '.version' claude-code/config.yaml)

          if [[ "${EVENT_NAME}" == "release" ]]; then
            version="${RELEASE_TAG}"
            version="${version#v}"

            # The Supervisor pulls image:version straight from config.yaml, so a
            # release whose tag does not match it publishes an image the add-on
            # will never ask for.
            if [[ "${version}" != "${config_version}" ]]; then
              echo "::error::Release tag ${version} does not match" \
                   "the version ${config_version} in claude-code/config.yaml"
              exit 1
            fi
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            version="${config_version}"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building version ${version}"

      - name: Get build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}
          registry-prefix: ${{ env.REGISTRY_PREFIX }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: [init, ingress-test]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # build-image only logs in to the registry when it is about to push, but
      # its cosign check of the cache image runs either way. Reading the cache
      # image of a private package without credentials fails with UNAUTHORIZED,
      # and the check burns five retries with backoff before giving up and
      # continuing. Logging in up front removes the noise and lets validation
      # runs use the registry cache instead of rebuilding from scratch.
      - name: Log in to the container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: home-assistant/builder/actions/build-image@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          arch: ${{ matrix.arch }}
          context: claude-code
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          push: ${{ needs.init.outputs.push }}
          version: ${{ needs.init.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs: [init, build]
    if: needs.init.outputs.push == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          registry-prefix: ${{ env.REGISTRY_PREFIX }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
